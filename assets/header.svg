<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#0D1326"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2140"/>
      <stop offset="1" stop-color="#0E1428"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="400" rx="18"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .fade { opacity: 0; animation: fade .9s ease-out forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .85s } .d5 { animation-delay: 1.1s }
      @keyframes fade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
      .swing { transform-origin: 790px -10px; animation: swing 6s ease-in-out infinite; }
      @keyframes swing { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(3deg) } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .8 } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="400" fill="url(#bg)"/>
    <rect width="1000" height="400" fill="url(#grid)"/>
    <rect width="1000" height="400" fill="url(#glow1)"/>
    <rect width="1000" height="400" fill="url(#glow2)"/>

    <!-- stars -->
    <g fill="#FFFFFF">
      <circle class="star" cx="120" cy="40" r="1.2"/>
      <circle class="star" cx="420" cy="70" r="1" style="animation-delay:1s"/>
      <circle class="star" cx="610" cy="30" r="1.3" style="animation-delay:2s"/>
      <circle class="star" cx="950" cy="350" r="1.1" style="animation-delay:.5s"/>
      <circle class="star" cx="560" cy="360" r="1" style="animation-delay:3s"/>
      <circle class="star" cx="300" cy="380" r="1.2" style="animation-delay:1.6s"/>
      <circle class="star" cx="960" cy="60" r="1" style="animation-delay:2.4s"/>
    </g>

    <!-- top bar -->
    <text x="48" y="44" class="mono" font-size="15" font-weight="700" fill="#E5E7EB">ahmed<tspan fill="#22D3EE">.</tspan>dev</text>
    <g class="mono" font-size="12" fill="#64748B">
      <text x="640" y="44" text-anchor="end">Cairo, Egypt · UTC+3</text>
    </g>

    <!-- left: hero -->
    <g class="fade d1">
      <circle class="pulse" cx="54" cy="112" r="4" fill="#22C55E"/>
      <text x="68" y="116" class="mono" font-size="12.5" fill="#94A3B8">Open to onsite · hybrid · remote — full-time &amp; freelance</text>
    </g>
    <text class="fade d2" x="46" y="185" font-size="62" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">Ahmed Khaled.</text>
    <text class="fade d3" x="48" y="232" font-size="30" font-weight="700" fill="url(#accent)">Software Engineer.</text>
    <g class="fade d4" font-size="15.5" fill="#A5B4C8">
      <text x="48" y="276">I build production-grade backend systems for AI-driven products —</text>
      <text x="48" y="300">APIs, microservices &amp; event-driven pipelines with
        <tspan fill="#E2E8F0" font-weight="700">FastAPI</tspan>,
        <tspan fill="#E2E8F0" font-weight="700">NestJS</tspan> &amp;
        <tspan fill="#E2E8F0" font-weight="700">Kubernetes</tspan>.</text>
    </g>

    <!-- terminal line -->
    <g class="fade d5">
      <rect x="48" y="326" width="448" height="38" rx="9" fill="#0B1222" stroke="#1E293B"/>
      <text x="64" y="350" class="mono" font-size="13"><tspan fill="#22D3EE">guest@ahmed.dev</tspan><tspan fill="#64748B">:~$ </tspan><tspan fill="#E2E8F0">whoami --short</tspan><tspan fill="#A78BFA">  → ACPC Finalist</tspan></text>
      <rect class="cursor" x="472" y="338" width="8" height="16" fill="#22D3EE"/>
    </g>

    <!-- right: lanyard + ID badge -->
    <g class="swing">
      <path d="M770 -10 L778 112" stroke="#22D3EE" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
      <path d="M810 -10 L802 112" stroke="#0EA5E9" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
      <rect x="776" y="104" width="28" height="22" rx="4" fill="#94A3B8"/>
      <g transform="translate(690 120)">
        <rect width="200" height="250" rx="16" fill="url(#card)" stroke="#334155"/>
        <rect x="80" y="10" width="40" height="7" rx="3.5" fill="#0A0F1F"/>
        <!-- monogram -->
        <rect x="20" y="30" width="160" height="92" rx="10" fill="#0B1222"/>
        <circle cx="100" cy="76" r="34" fill="none" stroke="url(#accent)" stroke-width="3"/>
        <text x="100" y="87" text-anchor="middle" font-size="30" font-weight="800" fill="url(#accent)">AK</text>
        <text x="20" y="144" class="mono" font-size="10" fill="#22D3EE" letter-spacing="2">AHMED.DEV</text>
        <text x="20" y="170" font-size="21" font-weight="800" fill="#F8FAFC">AHMED</text>
        <text x="20" y="193" font-size="21" font-weight="800" fill="url(#accent)">KHALED</text>
        <text x="20" y="211" font-size="11" fill="#94A3B8">Software Engineer</text>
        <text x="20" y="232" class="mono" font-size="8" fill="#64748B" letter-spacing="1">ACCESS</text>
        <text x="20" y="242" class="mono" font-size="9" font-weight="700" fill="#22D3EE" letter-spacing="1">ALL AREAS</text>
        <g fill="#CBD5E1" transform="translate(112 222)">
          <rect x="0" width="2" height="20"/><rect x="4" width="1" height="20"/><rect x="7" width="3" height="20"/>
          <rect x="12" width="1" height="20"/><rect x="15" width="2" height="20"/><rect x="19" width="1" height="20"/>
          <rect x="22" width="3" height="20"/><rect x="27" width="1" height="20"/><rect x="30" width="2" height="20"/>
          <rect x="34" width="1" height="20"/><rect x="37" width="3" height="20"/><rect x="42" width="1" height="20"/>
          <rect x="45" width="2" height="20"/><rect x="49" width="1" height="20"/><rect x="52" width="3" height="20"/>
          <rect x="57" width="1" height="20"/><rect x="60" width="2" height="20"/><rect x="64" width="1" height="20"/>
        </g>
        <rect x="0" y="246" width="200" height="4" rx="2" fill="url(#accent)"/>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="399" rx="18" fill="none" stroke="#1E293B"/>
</svg>
