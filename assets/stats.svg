<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .tile { opacity: 0; animation: up .7s ease-out forwards; }
      .t1 { animation-delay: .1s } .t2 { animation-delay: .3s } .t3 { animation-delay: .5s } .t4 { animation-delay: .7s }
      @keyframes up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
    </style>
  </defs>

  <g class="tile t1">
    <rect x="1" y="1" width="238" height="128" rx="14" fill="#0D1326" stroke="#1E293B"/>
    <rect x="1" y="1" width="238" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="24" y="66" font-size="38" font-weight="800" fill="url(#accent)">15,000+</text>
    <text x="24" y="100" class="mono" font-size="12.5" fill="#94A3B8">Users in production</text>
  </g>
  <g class="tile t2">
    <rect x="254" y="1" width="238" height="128" rx="14" fill="#0D1326" stroke="#1E293B"/>
    <rect x="254" y="1" width="238" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="277" y="66" font-size="38" font-weight="800" fill="url(#accent)">~20</text>
    <text x="277" y="100" class="mono" font-size="12.5" fill="#94A3B8">Microservices in prod</text>
  </g>
  <g class="tile t3">
    <rect x="507" y="1" width="238" height="128" rx="14" fill="#0D1326" stroke="#1E293B"/>
    <rect x="507" y="1" width="238" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="530" y="66" font-size="38" font-weight="800" fill="url(#accent)">2000+</text>
    <text x="530" y="100" class="mono" font-size="12.5" fill="#94A3B8">Problems solved</text>
  </g>
  <g class="tile t4">
    <rect x="760" y="1" width="238" height="128" rx="14" fill="#0D1326" stroke="#1E293B"/>
    <rect x="760" y="1" width="238" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="783" y="66" font-size="38" font-weight="800" fill="url(#accent)">7m → 9s</text>
    <text x="783" y="100" class="mono" font-size="12.5" fill="#94A3B8">Process speedup</text>
  </g>
</svg>
