<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="150" rx="16"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .type { animation: type 3.5s steps(34) .4s both; }
      @keyframes type { from { width: 0 } to { width: 290px } }
    </style>
    <clipPath id="typing"><rect class="type" x="190" y="96" height="30" width="290"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="150" fill="#0A0F1F"/>
    <rect width="1000" height="150" fill="url(#glow)"/>
    <text x="500" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Let's build <tspan fill="url(#accent)">something.</tspan></text>
    <rect x="0" y="92" width="1000" height="58" fill="#080C18"/>
    <line x1="0" y1="92" x2="1000" y2="92" stroke="#1E293B"/>
    <text x="40" y="117" class="mono" font-size="13"><tspan fill="#22D3EE">guest@ahmed.dev</tspan><tspan fill="#64748B">:~$</tspan></text>
    <text x="190" y="117" class="mono" font-size="13" fill="#E2E8F0" clip-path="url(#typing)">mail ahmedkhaledgomaa404@gmail.com</text>
    <rect class="cursor" x="462" y="105" width="8" height="16" fill="#22D3EE"/>
    <text x="960" y="117" text-anchor="end" class="mono" font-size="12" fill="#22C55E">● all systems ok</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="149" rx="16" fill="none" stroke="#1E293B"/>
</svg>
